<html lang="en">
<head>

<title>BatCAD · Precision in the dark.</title>

<style>
:root{--bg:#000;--g1:#0c0c0c;--g2:#181818;--ink:#e8e8e6;--ui:#050505;--bd:#1f1f1f;--mut:#7a7a7a;--hot:#ffd60a;--sel:#ffd60a;--win:#4d9dff;--crs:#3ddc84;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0}
body{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg);color:var(--ink);font:500 14px/1.3 Barlow,system-ui,sans-serif;overflow:hidden}
header,footer{background:var(--ui);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 10px}
header{border-bottom:1px solid var(--bd)}
footer{border-top:1px solid var(--bd);font-variant-numeric:tabular-nums}
.grp{display:flex;gap:2px}
button,label.b{font:inherit;color:inherit;background:transparent;border:1px solid var(--bd);padding:5px 10px;border-radius:2px;cursor:pointer;position:relative}
button:hover:not(:disabled),label.b:hover{background:var(--g1)}
button[aria-pressed=true]{background:var(--g1);box-shadow:inset 0 -2px var(--hot)}
button:disabled{opacity:.4;cursor:default}
kbd{font:inherit;margin-left:6px;opacity:.6}
:focus-visible,label.b:focus-within{outline:2px solid var(--sel);outline-offset:1px}
#file{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
#wrap{position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;outline-offset:-2px}
#num,#cmd{width:10em;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--bd);border-radius:2px;padding:4px 6px}
#cmd{width:22em;max-width:100%}
#pos{min-width:11em}
#read{font-weight:600}
#hint{color:var(--mut);flex:1;min-width:14em}
select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:2px;padding:5px 6px}
.hide{display:none!important}
label.b{display:inline-flex;align-items:center;justify-content:center}
#menu{position:fixed;z-index:10;min-width:11em;display:flex;flex-direction:column;background:var(--ui);border:1px solid var(--bd);border-radius:2px;padding:3px;box-shadow:0 6px 20px #0006}#menu button{border-color:transparent;text-align:left;white-space:nowrap}
dialog{background:var(--ui);color:var(--ink);border:1px solid var(--bd);border-radius:2px;padding:12px}dialog::backdrop{background:#0008}#nmIn{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--bd);border-radius:2px;padding:6px;width:14em;margin:6px 0 10px}dialog .grp{gap:6px;justify-content:flex-end}
@media(pointer:coarse){button,label.b,select,#cmd,#num{min-height:40px}body{height:100dvh}}
@media(max-width:700px),(pointer:coarse){footer{gap:4px 10px;padding:4px 8px}#pos{min-width:0}#cmd{flex:1 1 100%;width:auto;min-width:0}#num{flex:1 1 8em;width:auto}#hint{flex:1 1 100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;gap:4px 10px;padding:4px 8px}header::-webkit-scrollbar{display:none}header>*{flex:0 0 auto}button,label.b,select{white-space:nowrap}kbd{display:none}}
.brand{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;letter-spacing:.14em}.brand{border-color:transparent}.car{font-size:10px;opacity:.6;letter-spacing:0}.brand b{color:var(--hot)}.brand svg{width:16px;height:16px;fill:var(--hot)}

/* noir theme */
header,footer{background:var(--ui)}
header{border-bottom:1px solid #ffd60a40;box-shadow:0 1px 18px #ffd60a14}
footer{border-top:1px solid #ffd60a26}
button,label.b{border-radius:0;font-family:'Barlow Condensed',Barlow,system-ui,sans-serif;font-weight:600;font-size:14px;letter-spacing:.09em;text-transform:uppercase}
button:hover:not(:disabled),label.b:hover{background:#0d0d0d;border-color:var(--hot);color:var(--hot);box-shadow:0 0 10px #ffd60a30}
button[aria-pressed=true]{color:var(--hot);background:#0d0d0d;border-color:#ffd60a55;box-shadow:inset 0 -2px var(--hot),0 0 12px #ffd60a22}
kbd{font-family:Barlow,system-ui,sans-serif;letter-spacing:0;text-transform:none}
.brand{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;font-size:20px;letter-spacing:.16em}.brand svg{width:24px;height:24px;filter:drop-shadow(0 0 6px #ffd60a99)}.brand span:nth-of-type(1) b{text-shadow:0 0 12px #ffd60a66}
#menu button{text-align:left}#menu{box-shadow:0 10px 30px #000,0 0 0 1px #ffd60a22}
#wrap::before{content:"";position:absolute;left:0;right:0;bottom:0;height:140px;background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='900'%20height='140'%20viewBox='0%200%20900%20140'%3E%3Cg%20fill='%23fff'%20fill-opacity='.045'%3E%3Cpath%20d='M0%20140V92h22V70h18V92h14V52h6V34h4v18h6V80h26V60h20V96h18V40l9-14%209%2014V104h24V74h30V50h16V30h4V12h2v18h4V50h14V88h22V64h26V100h16V84h34V56h18V38h24V68h20V96h28V70h14V22h3V6h2v16h3V70h18V90h30V58h24V80h18V44h8V26h4V44h8V102h22V76h28V94h16V62h22V84h26V50h16V66h24V98h20V72h30V90h18V118h20V140z'/%3E%3C/g%3E%3Cg%20fill='%23ffd60a'%20fill-opacity='.22'%3E%3Crect%20x='70'%20y='60'%20width='3'%20height='3'/%3E%3Crect%20x='168'%20y='54'%20width='3'%20height='3'/%3E%3Crect%20x='312'%20y='36'%20width='3'%20height='3'/%3E%3Crect%20x='455'%20y='74'%20width='3'%20height='3'/%3E%3Crect%20x='602'%20y='44'%20width='3'%20height='3'/%3E%3Crect%20x='741'%20y='62'%20width='3'%20height='3'/%3E%3Crect%20x='830'%20y='80'%20width='3'%20height='3'/%3E%3C/g%3E%3C/svg%3E") bottom center/900px 140px repeat-x;pointer-events:none;z-index:1}
#wrap::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,#000c 100%);pointer-events:none;z-index:1}
select{border-radius:0}#num,#cmd,#nmIn,dialog{border-radius:0}
#cmd:focus,#num:focus,#nmIn:focus,select:focus{border-color:var(--hot);outline:none;box-shadow:0 0 10px #ffd60a30}
</style>

<body>
<header>
  <button class="brand" id="bMenu" aria-haspopup="menu" aria-expanded="false" aria-label="BatCAD menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M-1,-.38L-.34,-.22L-.26,-.72L0,-.4L.26,-.72L.34,-.22L1,-.38Q.9,.1 .58,.3Q.52,.08 .3,.12Q.2,.4 0,.62Q-.2,.4 -.3,.12Q-.52,.08 -.58,.3Q-.9,.1 -1,-.38Z" transform="translate(12 12.5) scale(11.5)"/></svg><span><b>BAT</b>CAD</span><span class="car" aria-hidden="true">▾</span></button>
  <div class="grp" id="tools" role="group" aria-label="Tools">
    <button data-t="select">Select<kbd>V</kbd></button>
    <button data-t="line">Line<kbd>L</kbd></button>
    <button data-t="rect">Rectangle<kbd>R</kbd></button>
    <button data-t="circ">Circle<kbd>C</kbd></button>
    <button data-t="arc">Arc<kbd>A</kbd></button>
    <button data-t="poly">Polyline<kbd>P</kbd></button>
    <button data-t="dim">Dimension<kbd>D</kbd></button>

    <button data-t="ext">Extend<kbd>E</kbd></button>
  </div>
  <div class="grp" role="group" aria-label="Snapping">

    <button id="bOrtho">Ortho<kbd>Shift</kbd></button>
  </div>
  <div class="grp">
    <button id="bUndo">Undo</button><button id="bRedo">Redo</button><button id="bDel">Delete</button>
  </div>
  <div class="grp">
    <button id="bIn" aria-label="Zoom in">+</button><button id="bOut" aria-label="Zoom out">&minus;</button><button id="bFit">Fit</button>
  </div>
  <div class="grp">
    <label class="b">Open .bat / .dxf<input id="file" type="file" accept=".bat,.nja,.dxf" aria-label="Open a .bat or .dxf drawing"></label>
    <button id="bSave" class="hide">Save .bat</button>
    <button id="bSvg" class="hide">Export .svg</button>
    <button id="bDxf" class="hide">Export .dxf</button>
  </div>
<div class="grp" role="group" aria-label="Layers"><select id="lay" aria-label="Current layer"></select><button id="bLayNew">New layer</button><button id="bLayVis">Hide layer</button><button id="bLayMove">Move selection here</button></div>
</header>
<div id="wrap"><canvas id="cv" tabindex="0" aria-label="Drawing area"></canvas></div>
<footer>
  <span id="pos"></span>
  <span id="read"></span>
  <input id="cmd" placeholder="Command: rotate 90, copy 10,5, offset 5, fillet 5, help  ( / )" aria-label="Command line" autocomplete="off" spellcheck="false">
  <input id="num" class="hide">
  <span id="hint"></span>
</footer>
<div id="menu" class="hide" role="menu"><button role="menuitem" data-a="open">Open .bat / .dxf</button><button role="menuitem" id="mSave" data-a="save">Save .bat</button><button role="menuitem" id="mSvg" data-a="svg">Export .svg</button><button role="menuitem" id="mDxf" data-a="dxf">Export .dxf</button></div>
<dialog id="nmDlg"><form method="dialog"><label>Drawing name<br><input id="nmIn" autocomplete="off" spellcheck="false"> .bat</label><div class="grp"><button type="button" id="nmNo">Cancel</button><button value="ok">Save</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d'),R6=v=>Math.round(v*1e6)/1e6;
let E=[],U=[],Rd=[],sel=new Set(),tool='select',pts=[],mp=[0,0],sp=null,V={s:4,x:60,y:400},W=1,H=1,dpr=1,drag=null,shift=false,space=false,DL=null,q=0,started=false;
const opt={grid:true,obj:true,ortho:false};
let Lay=[{id:0,name:'Layer 0',hue:null,vis:true}],cl=0;
const w2s=p=>[V.x+p[0]*V.s,V.y-p[1]*V.s],s2w=p=>[(p[0]-V.x)/V.s,(V.y-p[1])/V.s];
const gstep=()=>{const r=28/V.s/UF(),p=10**Math.floor(Math.log10(r)),m=r/p;return UF()*p*(m<=1?1:m<=2?2:m<=5?5:10)};
const clone=o=>JSON.parse(JSON.stringify(o));

/* geometry */
function seg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
const corners=o=>{const[[x1,y1],[x2,y2]]=[o.a,o.b];return[[x1,y1],[x2,y1],[x2,y2],[x1,y2]]};
const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
function dist(o,w){if(K[o.t])return K[o.t].d(o,w);
  if(o.t=='line')return seg(w,o.a,o.b);
  if(o.t=='rect'){const c=corners(o);return Math.min(...c.map((p,i)=>seg(w,p,c[(i+1)%4])))}
  return Math.abs(Math.hypot(w[0]-o.c[0],w[1]-o.c[1])-o.r)}
function keyPts(o){if(K[o.t])return K[o.t].k(o);
  if(o.t=='line')return[o.a,o.b,mid(o.a,o.b)];
  if(o.t=='rect')return[...corners(o),mid(o.a,o.b)];
  const[x,y]=o.c,r=o.r;return[o.c,[x+r,y],[x-r,y],[x,y+r],[x,y-r]]}
function bounds(){
  let a=[1/0,1/0],b=[-1/0,-1/0];
  const f=p=>{a=[Math.min(a[0],p[0]),Math.min(a[1],p[1])];b=[Math.max(b[0],p[0]),Math.max(b[1],p[1])]};
  for(const o of E){if(K[o.t]){K[o.t].b(o).forEach(f);continue}if(o.t=='circ'){f([o.c[0]-o.r,o.c[1]-o.r]);f([o.c[0]+o.r,o.c[1]+o.r])}else{f(o.a);f(o.b)}}
  return E.length?{a,b}:null}
function gridQ(x,y,r){
  if(!GR||GR.E!==E||GR.n!==E.length){
    const bx=E.map(o=>{const b=eb(o);for(const p of keyPts(o)){b.x0=Math.min(b.x0,p[0]);b.x1=Math.max(b.x1,p[0]);b.y0=Math.min(b.y0,p[1]);b.y1=Math.max(b.y1,p[1])}return b});
    let X0=1/0,X1=-1/0,Y0=1/0,Y1=-1/0;for(const b of bx){X0=Math.min(X0,b.x0);X1=Math.max(X1,b.x1);Y0=Math.min(Y0,b.y0);Y1=Math.max(Y1,b.y1)}
    const N=Math.min(512,Math.max(8,Math.ceil(Math.sqrt(E.length)))),cs=Math.max((Math.max(X1-X0,Y1-Y0)||1)/N,1e-9),cells=new Map(),big=[];
    bx.forEach((b,i)=>{const i0=Math.floor(b.x0/cs),i1=Math.floor(b.x1/cs),j0=Math.floor(b.y0/cs),j1=Math.floor(b.y1/cs);
      if((i1-i0+1)*(j1-j0+1)>64){big.push(i);return}
      for(let a=i0;a<=i1;a++)for(let d=j0;d<=j1;d++){const k=a+','+d;(cells.get(k)||cells.set(k,[]).get(k)).push(i)}});
    GR={E,n:E.length,cs,cells,big}}
  const{cs,cells,big}=GR,a0=Math.floor((x-r)/cs),a1=Math.floor((x+r)/cs),b0=Math.floor((y-r)/cs),b1=Math.floor((y+r)/cs);
  if((a1-a0+1)*(b1-b0+1)>2000)return E.map((_,i)=>i);
  const out=new Set(big);
  for(let a=a0;a<=a1;a++)for(let d=b0;d<=b1;d++){const l=cells.get(a+','+d);if(l)for(const i of l)out.add(i)}
  return[...out].sort((u,v)=>u-v)}
let bx=null,aim=0,nav=false,gest=null;const PT=new Map(),AIM=50,CP=matchMedia('(pointer:coarse)').matches,SN=CP?18:10;
function gestMove(){const[a,b]=[...PT.values()],r=cv.getBoundingClientRect(),m=[(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(gest&&gest.d>0&&d>0){zoomAt(gest.m,d/gest.d);V.x+=m[0]-gest.m[0];V.y+=m[1]-gest.m[1]}gest={m,d};redraw()}
function outline(o){
  if(o.t=='circ'||o.t=='arc'){const a0=o.t=='arc'?o.s:0,sp_=o.t=='arc'?span(o):Math.PI*2,n=Math.max(8,Math.ceil(sp_*8)),r=[];for(let i=0;i<=n;i++){const a=a0+sp_*i/n;r.push([o.c[0]+o.r*Math.cos(a),o.c[1]+o.r*Math.sin(a)])}return r}
  if(o.t=='line')return[o.a,o.b];
  if(o.t=='poly')return o.z?[...o.p,o.p[0]]:o.p;
  if(o.t=='rect'){const q=corners(o);return[...q,q[0]]}
  const b=eb(o);return[[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1],[b.x0,b.y0]]}
function segRect(a,b,x0,y0,x1,y1){let t0=0,t1=1;const dx=b[0]-a[0],dy=b[1]-a[1];
  for(const[p,q]of[[-dx,a[0]-x0],[dx,x1-a[0]],[-dy,a[1]-y0],[dy,y1-a[1]]]){if(p==0){if(q<0)return false}else{const r=q/p;if(p<0){if(r>t1)return false;if(r>t0)t0=r}else{if(r<t0)return false;if(r<t1)t1=r}}}return true}
function boxHit(o,x0,y0,x1,y1,cross){const P=outline(o);
  if(!cross)return P.every(p=>p[0]>=x0&&p[0]<=x1&&p[1]>=y0&&p[1]<=y1);
  for(let i=1;i<P.length;i++)if(segRect(P[i-1],P[i],x0,y0,x1,y1))return true;return false}
function bxRect(){return[Math.min(bx.a[0],bx.b[0]),Math.min(bx.a[1],bx.b[1]),Math.max(bx.a[0],bx.b[0]),Math.max(bx.a[1],bx.b[1]),bx.b[0]<bx.a[0]]}
function finishBox(add){const[x0,y0,x1,y1,cr]=bxRect();if(!add)sel.clear();
  for(const o of E)if(vis(o)&&ed(o)&&boxHit(o,x0,y0,x1,y1,cr)){sel.add(o);if(o.g!=null)E.forEach(x=>{if(x.g===o.g)sel.add(x)})}
  bx=null;ui();redraw()}
function pick(e){const w=s2w(e);let best=null,bd=(CP?14:7)/V.s;for(const i of gridQ(w[0],w[1],bd)){const o=E[i];if(!ed(o))continue;const d=dist(o,w);if(d<=bd){bd=d;best=o}}return best}
function snapAt(e,skip){
  let w=s2w(e),k=null;
  if(opt.obj){let best=SN;for(const i of gridQ(w[0],w[1],SN/V.s)){const o=E[i];if(!vis(o)||skip&&sel.has(o))continue;for(const p of keyPts(o)){const s=w2s(p),d=Math.hypot(s[0]-e[0],s[1]-e[1]);if(d<best){best=d;w=p;k='obj'}}}}
  if(!k&&opt.grid){const g=gstep();w=[Math.round(w[0]/g)*g,Math.round(w[1]/g)*g];k='grid'}
  return{w:w.map(R6),k}}
function cur(e){
  const r=cv.getBoundingClientRect();mp=[e.clientX-r.left,e.clientY-r.top-(aim&&e.pointerType=='touch'?AIM:0)];sp=snapAt(mp,drag&&(drag.move||drag.grip));
  if((tool=='line'||tool=='poly')&&pts.length&&(opt.ortho||shift)){const a=pts[pts.length-1],p=sp.w;sp.w=Math.abs(p[0]-a[0])>=Math.abs(p[1]-a[1])?[p[0],a[1]]:[a[0],p[1]]}}

/* entity kinds: d=distance k=key points b=bounds s=canvas path mv=move v=svg ok=validate n=normalize info=readout */
const TAU=Math.PI*2,span=o=>((o.e-o.s)%TAU+TAU)%TAU,inArc=(o,t)=>((t-o.s)%TAU+TAU)%TAU<=span(o)+1e-9,arcEnds=o=>[o.s,o.e].map(a=>[o.c[0]+o.r*Math.cos(a),o.c[1]+o.r*Math.sin(a)]);
const psegs=o=>o.p.slice(1).map((p,i)=>[o.p[i],p]).concat(o.z?[[o.p[o.p.length-1],o.p[0]]]:[]);
const cs=o=>{const c=corners(o);return c.map((p,i)=>[p,c[(i+1)%4]])};
const lay=o=>Lay.find(x=>x.id==o.l),vis=o=>{const y=lay(o);return!y||y.vis};
function circ3(a,b,c){const d=2*(a[0]*(b[1]-c[1])+b[0]*(c[1]-a[1])+c[0]*(a[1]-b[1]));if(Math.abs(d)<1e-12)return null;const f=p=>p[0]*p[0]+p[1]*p[1];return[(f(a)*(b[1]-c[1])+f(b)*(c[1]-a[1])+f(c)*(a[1]-b[1]))/d,(f(a)*(c[0]-b[0])+f(b)*(a[0]-c[0])+f(c)*(b[0]-a[0]))/d]}
